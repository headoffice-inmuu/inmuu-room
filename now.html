<script>

const $ = s => document.querySelector(s);

    if (on) box.scrollTo({ left: on.offsetLeft - box.offsetLeft - (box.clientWidth - on.offsetWidth) / 2, behavior: 'smooth' });

function stateOf(cells, cur) {
  const c = cells[cur] || 'x';
  const next = (from, want) => { for (let s = from; s < 48; s++) if (want(cells[s])) return s; return -1; };
  if (c === 'f') { const end = next(cur, v => v !== 'f'); return { k: 'f', st: '비어 있음', msg: end < 0 ? '자정까지 비어 있어요' : cells[end] === 'b' ? `${timeOf(end)}까지 비어 있어요` : `이용 마감 ${timeOf(end)}까지 비어 있어요` }; }
  if (c === 'b') { const fr = next(cur, v => v !== 'b'); return { k: 'b', st: '사용 중', msg: fr < 0 ? '오늘 남은 시간 모두 사용 중' : cells[fr] === 'f' ? `${timeOf(fr)}부터 비어요` : `${timeOf(fr)}까지 사용 중 (그 뒤 이용 마감)` }; }
  const op = next(cur, v => v !== 'x'); return { k: 'x', st: '이용 시간 아님', msg: op < 0 ? '오늘 이용 시간이 끝났어요' : `${timeOf(op)}부터 이용할 수 있어요` };
}
// 층 묶음: 도면 구역 열쇠 앞 숫자(7f → 7층, 5l·5c·5r → 5층). 같은 층 구역은 한 도면으로 합침
function floorsOf() {
  const g = new Map();
  for (const z of D.zones) {
    if (!z.plan || !z.plan.viewBox) continue;
    const f = String(z.plan.key || z.name);   // 구역마다 한 장 (2026-10-26 민제 "폰트 때문에 보기 힘들다": 5층 세 구역을 한 장에 몰면 글씨가 작아짐)

  const f = fl.find(x => x.key === FLOOR);
  // 글씨 크기: 구역이 달라도 화면에서 같은 크기로 (2026-10-26 민제 "구역마다 폰트 사이즈가 뒤죽박죽")
  //   실제로 그려지는 배율 = 너비에 맞춘 배율과 높이(화면 56%)에 맞춘 배율 중 작은 쪽 → k = 도면 단위 / 화면 1px
  const vb = f.viewBox.split(/\s+/).map(Number);

  const minFont = d => d.replace(/font-size=(['"])([\d.]+)['"]/g, (m, q, n) => `font-size=${q}${Math.min(Math.max(+n, 11 * k), 20 * k)}${q}`);

  const ticks = span.map(s => `<span>${s % 2 === 0 && s < 48 ? s / 2 + '시' : ''}</span>`).join('');
  // 열린 구역을 위로, 지금 닫힌 구역은 한 줄로 접어 아래로
  const zs = D.zones.map(z => ({ z, openNow: sameDay && z.rooms.some(r => (r.cells[cur] || 'x') !== 'x') })).sort((a, b) => b.openNow - a.openNow);
  const rank = { f: 0, b: 1, x: 2 };
  const html = zs.map(({ z, openNow }) => {
    if (!openNow) {
      if (ONLY_FREE || !z.rooms.some(pass)) return '';
      const op = sameDay ? Math.min(...z.rooms.map(r => { const i = r.cells.slice(cur).search(/[fb]/); return i < 0 ? 99 : cur + i; })) : 99;
      return `<section class="shut"><h2>${esc(z.name)} <small>지금 이용 시간 아님 · ${op < 48 ? timeOf(op) + '부터' : '오늘 마감'}</small></h2></section>`;
    }
    const list = z.rooms.filter(pass).map(r => ({ r, s: stateOf(r.cells, cur), nf: (() => { for (let x = cur; x < 48; x++) if (r.cells[x] === 'f') return x; return 99; })() }))
      .filter(x => !ONLY_FREE || x.s.k === 'f').sort((a, b) => rank[a.s.k] - rank[b.s.k] || a.nf - b.nf);
    if (!list.length) return '';
    const open = z.rooms.map(r => r.cells.search(/[fb]/) >= 0 ? [r.cells.search(/[fb]/), 48 - [...r.cells].reverse().join('').search(/[fb]/)] : null).filter(Boolean);
    const hours = open.length ? (Math.min(...open.map(o => o[0])) === 0 && Math.max(...open.map(o => o[1])) === 48 ? '24시간' : `${timeOf(Math.min(...open.map(o => o[0])))}~${timeOf(Math.max(...open.map(o => o[1])))}`) : '오늘 휴무';
    const nf = list.filter(x => x.s.k === 'f').length;
    return `<section><h2>${esc(z.name)} <small>오늘 ${hours} · 빈 방 ${nf}</small></h2>${list.map(({ r, s }) => `
      <div class="room ${s.k}" data-id="${r.id}"><div class="row"><div class="name">${esc(bigOf(r.label))}<small>${esc(catName(r))}</small></div><span class="st">${s.st}</span></div>
        <div class="msg">${esc(s.msg)}</div>
        <div class="tl">${span.map((c, i) => `<i class="${c < 48 ? r.cells[c] : 'none'} ${i === 0 ? 'now' : ''}"></i>`).join('')}</div><div class="ticks">${ticks}</div></div>`).join('')}</section>`;
  }).join('');
  $('#list').innerHTML = html || `<div class="empty">${ONLY_FREE ? '지금 빈 방이 없어요. 막대를 보고 비는 시간을 확인해 주세요.' : '표시할 방이 없어요.'}</div>`;
  document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { TYPE = b.dataset.type; CENTER = '#bar'; draw(); });
  $('[data-free]').onclick = () => { ONLY_FREE = !ONLY_FREE; draw(); };
}
async function load() {
  try {
    const r = await fetch(`${SUPA}/rest/v1/practice_status?branch_id=eq.${B}&select=data,updated_at`, { headers: { apikey: KEY } });
    const j = await r.json();
    if (!r.ok || !Array.isArray(j) || !j.length) throw new Error('none');
    D = j[0].data; AT = j[0].updated_at; draw();
  } catch (e) {
    if (!D) $('#list').innerHTML = '<div class="empty">연습실 현황을 불러오지 못했어요.<br>인터넷 연결을 확인하고 잠시 뒤 다시 열어 주세요.</div>';
  }
}
load();
setInterval(load, 60000);
setInterval(draw, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
let RZ; window.addEventListener('resize', () => { clearTimeout(RZ); RZ = setTimeout(draw, 200); });   // 화면 크기가 바뀌면 도면 글씨 다시 맞춤
</script>
</body>
</html>
