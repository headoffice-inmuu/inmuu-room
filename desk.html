<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인생뮤직 연습실 예약</title>

<!-- 연습실 예약 PC 화면 (2026-10-22 민제, 1차 시안 = Figma 4안): 흰 바탕·얇은 선 도면, 방은 칠하지 않고 테두리 색으로
     예약 가능(주황) / 사용 중(옅은 회색) / 고른 방(굵은 주황). 둥근 모서리 없음, 모노톤. 학원에 둔 수강생 컴퓨터에서 연다 -->
<style>
  :root { --brand:#FF6B35; --ink:#111111; --line:#3F3B36; --sub:#6B655C; --mute:#A8A39A; --soft:#D9D6D0; --bg:#FFFFFF; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden; }
  header { height:64px; flex:none; display:flex; align-items:center; gap:18px; padding:0 28px; border-bottom:1px solid #ECEAE6; }
  header h1 { font-size:22px; margin:0; }
  header .sub { font-size:15px; color:var(--sub); }
  .legend { margin-left:auto; display:flex; gap:16px; font-size:14px; color:#444; }
  .legend i { display:inline-block; width:15px; height:15px; vertical-align:-2px; margin-right:6px; background:#fff; }
  .clock { font-size:24px; font-weight:700; margin-left:20px; }
  .mine { border:1px solid var(--line); background:#fff; padding:8px 14px; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:370px 250px minmax(0, 1fr); gap:28px; padding:22px 28px; }
  .col { display:flex; flex-direction:column; gap:14px; min-height:0; }
  .card { border:1px solid var(--soft); padding:20px 22px; background:#fff; }
  .st { display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:700; }
  .pill { border:1px solid var(--soft); padding:3px 10px; font-size:13px; font-weight:500; color:#444; }
  .card h2 { font-size:32px; margin:12px 0 2px; }
  .code { font-size:15px; color:var(--mute); }
  .hint { font-size:15px; color:var(--sub); line-height:1.75; margin:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--soft); background:#fff; padding:9px 14px; font:inherit; font-size:15px; cursor:pointer; color:#333; }
  .chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .chip:disabled { color:#C9C5BE; cursor:default; }
  .go { width:100%; border:0; background:var(--brand); color:#fff; padding:16px; font:inherit; font-size:18px; font-weight:700; cursor:pointer; margin-top:14px; }
  .go:disabled { background:#E6E3DE; color:#A8A39A; cursor:default; }
  .plan { min-height:0; display:flex; align-items:center; justify-content:center; }
  .plan svg { width:100%; height:100%; }
  .room { cursor:pointer; }
  .room.busy { cursor:default; }
  .extra { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:13px; color:var(--sub); align-items:center; }
  .zones { display:flex; gap:8px; flex-wrap:wrap; }   /* 구역 = 도면 위 (2026-10-23 민제) */
  .z { border:0; background:#F1EFEB; color:#444; padding:10px 18px; font:inherit; font-size:16px; cursor:pointer; }
  .z.on { background:var(--ink); color:#fff; }
  .modal { position:fixed; inset:0; background:rgba(17,17,17,.45); display:flex; align-items:center; justify-content:center; z-index:10; }
  .sheet { background:#fff; width:460px; max-height:86vh; overflow:auto; padding:26px 28px; border:1px solid var(--line); }
  .sheet h3 { font-size:22px; margin:0 0 6px; }
  label { display:block; font-size:15px; font-weight:700; margin:14px 0 6px; }
  input { width:100%; font:inherit; font-size:22px; padding:12px 14px; border:1px solid var(--line); border-radius:0; }
  input:focus { outline:2px solid var(--brand); outline-offset:-1px; }
  .row { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; border:1px solid var(--line); background:#fff; padding:13px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  .btn.pri { background:var(--brand); border-color:var(--brand); color:#fff; }
  .msg { min-height:22px; margin-top:10px; font-weight:700; color:#C62828; font-size:15px; }
  .msg.ok { color:var(--ink); }
  .my { border:1px solid var(--soft); padding:12px 14px; margin-top:10px; }
  .my .h { display:flex; justify-content:space-between; font-weight:700; font-size:16px; }
  .my .a { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .my .a .btn { flex:none; padding:8px 12px; font-size:14px; }
  .tag { font-size:12px; font-weight:700; padding:2px 8px; border:1px solid var(--soft); }
  .tag.warn { border-color:var(--brand); color:var(--brand); }
  .center { max-width:420px; margin:14vh auto; }
  /* 고른 방 하루 일정 */
  .sched { flex:1; min-height:0; display:flex; flex-direction:column; padding:18px 16px 12px; }
  .dleg { display:flex; gap:12px; font-size:12px; color:var(--sub); margin:8px 0 10px; }
  .dleg i { display:inline-block; width:12px; height:10px; margin-right:4px; vertical-align:-1px; }
  .dleg i.p { border:2px solid var(--brand); }
  .st-wrap { flex:1; min-height:0; overflow:auto; border-top:1px solid var(--soft); }
  .st-grid { position:relative; display:grid; grid-template-columns:48px 1fr; }
  .st-t { grid-column:1; font-size:12px; color:var(--sub); padding-top:2px; }
  .st-c { grid-column:2; border-top:1px dashed #EEECE8; }
  .st-c.hr, .st-t.hr { border-top:1px solid #E3E0DB; }
  .st-c.past { background:#FAFAF8; }
  .st-c.can { cursor:pointer; }
  .st-c.can:hover { background:#FFF3EC; }
  .st-b { grid-column:2; margin:2px 4px 2px 6px; padding:3px 8px; font-size:12px; display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
  .st-b b { font-size:13px; }
  .st-b.les { background:#8A847B; color:#fff; }
  .st-b.pra { background:#D9D6D0; color:#333; }
  .st-b.past { opacity:.45; }
  .st-p { grid-column:2; margin:0 2px 0 4px; border:3px solid var(--brand); padding:2px 8px; font-size:12px; color:var(--brand); display:flex; flex-direction:column; justify-content:center; pointer-events:none; background:rgba(255,107,53,.06); }
  .st-b.one, .st-p.one { flex-direction:row; align-items:center; gap:8px; padding-top:0; padding-bottom:0; }
  .st-now { position:absolute; left:44px; right:0; height:2px; background:var(--brand); }
</style>
</head>
<body>

</html>
